<style>
/* Layout: one narrow phone column of working cards; the envelope is a kraft-paper card you copy from; tab bar pinned to the bottom. */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --ink: #17202B;
  --muted: #5A6472;
  --line: #DCE1E7;
  --field: #F6F7F9;
  --accent: #0D6E69;
  --accent-ink: #FFFFFF;
  --kraft: #E6CFA3;
  --kraft-ink: #3B2C14;
  --kraft-line: #C7A874;
  --good: #1C8248;
  --warn: #B86200;
  --bad: #C0322A;
  --good-bg: #E5F4EB;
  --warn-bg: #FBF0E1;
  --bad-bg: #FBE7E5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1318; --surface: #19202A; --ink: #E7EBF0; --muted: #9AA4B2; --line: #2A333F; --field: #121820;
    --accent: #3DB5AC; --accent-ink: #06201E;
    --kraft: #4A3B25; --kraft-ink: #F3E4C6; --kraft-line: #6E5934;
    --good: #4FC683; --warn: #F2A541; --bad: #FF6E61;
    --good-bg: #13291D; --warn-bg: #2D2112; --bad-bg: #331715;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #19202A; --ink: #E7EBF0; --muted: #9AA4B2; --line: #2A333F; --field: #121820;
  --accent: #3DB5AC; --accent-ink: #06201E;
  --kraft: #4A3B25; --kraft-ink: #F3E4C6; --kraft-line: #6E5934;
  --good: #4FC683; --warn: #F2A541; --bad: #FF6E61;
  --good-bg: #13291D; --warn-bg: #2D2112; --bad-bg: #331715;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
main {
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 16px;
}
h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.85rem;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); font-size: .95rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.card-title {
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.card-title .count { font-family: var(--mono); letter-spacing: 0; text-transform: none; }

/* Fields */
.field { display: grid; grid-template-columns: 8.5rem minmax(0, 12rem); align-items: center; gap: 12px; }
.field label { font-weight: 600; }
.money {
  display: flex; align-items: center; gap: 6px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
}
.money span { color: var(--muted); font-family: var(--mono); }
.money input {
  border: 0; background: transparent; outline: none;
  width: 100%; min-width: 0;
  padding: 11px 0;
  font-family: var(--mono); font-size: 18px; font-weight: 500;
}
.money:focus-within, .text:focus, .date-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.text, .date-input, textarea {
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 17px;
  width: 100%;
  min-width: 0;
  outline: none;
}
textarea { font-family: var(--mono); font-size: 13px; min-height: 120px; resize: vertical; }

/* Segmented controls */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--field); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button {
  border: 0; background: transparent; border-radius: 8px; padding: 9px 8px;
  font-weight: 600; cursor: pointer; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg button:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .row-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 14px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { width: 100%; padding: 15px; font-size: 1.1rem; border-radius: 12px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.btn.small { padding: 6px 11px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  width: 44px; height: 44px; display: inline-grid; place-items: center; cursor: pointer; flex: none;
}
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; }

/* Date row */
.date-big { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.date-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.date-input { width: auto; flex: 1 1 9rem; font-family: var(--mono); font-size: 16px; }

/* Switches */
.switches { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px 7px 9px;
  cursor: pointer; font-weight: 600; font-size: .95rem; user-select: none;
}
.chip input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.chip:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Amount rows */
.rows { display: grid; gap: 8px; }
.amt { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.amt .k { color: var(--muted); }
.amt .v { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.total { border-top: 1px solid var(--line); padding-top: 10px; }
.amt.total .k { color: var(--ink); font-weight: 700; }
.amt.total .v { font-weight: 700; font-size: 1.25rem; }
.neg { color: var(--good); }
.loss { color: var(--bad) !important; }

/* Envelope: the one bold element */
.envelope {
  background: var(--kraft);
  color: var(--kraft-ink);
  border: 1px solid var(--kraft-line);
  border-radius: 6px 6px 14px 14px;
  padding: 0 18px 18px;
  display: grid; gap: 10px;
  position: relative;
  overflow: hidden;
}
.envelope::before {
  content: ""; display: block; height: 30px; margin: 0 -18px 4px;
  background:
    linear-gradient(to bottom right, transparent 49.5%, var(--kraft-line) 50%, transparent 51.5%) left / 50% 100% no-repeat,
    linear-gradient(to bottom left, transparent 49.5%, var(--kraft-line) 50%, transparent 51.5%) right / 50% 100% no-repeat;
  opacity: .7;
}
.envelope .card-title { color: color-mix(in srgb, var(--kraft-ink) 70%, transparent); }
.envelope .label { font-family: var(--hand); font-weight: 700; font-size: 1.9rem; line-height: 1.1; text-wrap: balance; }
.envelope .amt .k { color: color-mix(in srgb, var(--kraft-ink) 75%, transparent); }
.envelope .amt.total { border-top: 1.5px dashed var(--kraft-line); }
.envelope .amt.total .k { color: var(--kraft-ink); }
.envelope .neg { color: inherit; font-weight: 700; }
.envelope .tag { justify-self: start; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 4px; padding: 2px 7px; }

/* Tipout lines */
.tip-line { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.tip-line .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tip-line .who { font-weight: 700; }
.tip-line .v { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.tip-line .ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tip-line .ctrl .text { flex: 1 1 9rem; width: auto; }
.later { color: var(--warn); font-size: .9rem; font-weight: 600; }

/* Banners */
.banner { border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-weight: 600; }
.banner.good { background: var(--good-bg); color: var(--good); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.info { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent); }
.hint { color: var(--muted); font-size: .9rem; }

/* Lists */
.list { display: grid; }
.row { border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-main {
  width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0;
}
.row-main .t { font-weight: 700; }
.row-main .s { color: var(--muted); font-size: .9rem; }
.row-main .r { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: .95rem; }
.row-detail { padding: 4px 0 16px; display: grid; gap: 12px; }
.mini { display: grid; gap: 6px; font-size: .95rem; }
.debt { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.debt .info { flex: 1 1 10rem; min-width: 0; }
.debt .info .s { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.debt .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; }
.person-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-top: 6px; }
.person-head .n { font-weight: 700; font-size: 1.05rem; }
.person-head .v { font-family: var(--mono); font-weight: 700; }
.split-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.stat .k { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--mono); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet {
  font-family: var(--mono); font-size: .95rem; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0;
}
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.week-nav .t { font-family: var(--display); font-weight: 600; font-size: 1.2rem; text-align: center; text-wrap: balance; }
.form-grid { display: grid; gap: 12px; }
.log-item { padding: 8px 0; border-top: 1px solid var(--line); font-size: .92rem; overflow-wrap: anywhere; }
.log-item .when { color: var(--muted); font-size: .82rem; font-family: var(--mono); }
details summary { cursor: pointer; font-weight: 700; }
.pct-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pct-row .money { width: 8.5rem; }
.empty { color: var(--muted); padding: 6px 0; }
.onb-head { display: grid; gap: 6px; padding-top: 8px; }
.onb-kicker { font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.onb-sub { margin: 0; color: var(--muted); }
.loc-grid { display: grid; gap: 12px; }
.loc-card {
  border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px;
  display: flex; align-items: center; gap: 16px; cursor: pointer; position: relative; text-align: left;
}
.loc-card img { width: 96px; height: 96px; flex: none; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.loc-card .loc-name { font-family: var(--display); font-weight: 600; font-size: 1.25rem; }
.loc-card[aria-pressed="true"] { border-color: var(--accent); }
.loc-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.loc-check { position: absolute; top: 10px; right: 10px; background: var(--accent); color: var(--accent-ink); font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
.loc-row { display: flex; align-items: center; gap: 12px; }
.loc-row img { border-radius: 10px; border: 1px solid var(--line); object-fit: cover; flex: none; }
.loc-row .loc-name { flex: 1; font-weight: 700; }
.loc-tag { font-size: .72rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; vertical-align: middle; }
.onb-logo { border-radius: 12px; border: 1px solid var(--line); object-fit: cover; }
.big-input { font-size: 20px; padding: 14px; }
.tut-card { gap: 16px; }
.tut-body { margin: 0; font-size: 1.05rem; }
.tut-art { display: grid; gap: 10px; pointer-events: none; }
.tut-env { pointer-events: none; }
.tut-env .label { font-size: 1.5rem; }
.tut-sheet { pointer-events: none; }
.dots { display: flex; justify-content: center; gap: 8px; }
.dot-i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot-i.on { background: var(--accent); width: 22px; border-radius: 4px; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.count-pill { display: inline-block; min-width: 1.8em; text-align: center; font-family: var(--mono); font-weight: 700; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); border-radius: 999px; padding: 1px 8px; }
.role-select { width: auto; flex: 0 0 auto; padding: 8px 10px; font-size: 16px; }
.role-head { font-weight: 700; color: var(--muted); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 10px; }
.role-head .count { font-family: var(--mono); letter-spacing: 0; }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center;
}
nav.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; }
.tab {
  border: 0; background: none; cursor: pointer; padding: 6px 2px;
  display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: .74rem; font-weight: 600;
  position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .dot { position: absolute; top: 4px; right: calc(50% - 18px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--warn); color: #fff; font-size: .68rem; line-height: 17px; padding: 0 4px; }

/* Modal + toast */
.modal-back { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 600px) { .modal-back { place-items: center; } }
.modal { background: var(--surface); border-radius: 16px; padding: 20px; width: 100%; max-width: 440px; display: grid; gap: 14px; max-height: 85vh; overflow: auto; }
.modal h2 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 0; }
.modal p { margin: 0; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 30; box-shadow: 0 6px 20px rgb(0 0 0 / .2); max-width: calc(100% - 32px); }

@media (max-width: 420px) {
  .field { grid-template-columns: 1fr; gap: 6px; }
  .field .money { max-width: 14rem; }
  h1 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
}

/* ---- v2 additions ---- */
.hold { position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.hold .hold-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, currentColor 18%, transparent); }
.hold.holding .hold-fill { width: 100%; transition: width .9s linear; }
.hold .hold-label { position: relative; }
.btn.neutral { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.rule { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); }
.pct-row label .rule { display: inline; }
.logo { border-radius: 12px; border: 1px solid var(--line); object-fit: cover; flex: none; }
.logo.mono { display: inline-grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 1.4rem; }
.loc-card .logo { width: 72px; height: 72px; }
.loc-text { display: grid; gap: 2px; min-width: 0; }
.loc-sub { color: var(--muted); font-size: .88rem; }
.loc-card .loc-tag { margin-left: auto; }
.ex-toggle { justify-self: start; }
.role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.role-card { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px 14px; text-align: left; display: grid; gap: 4px; cursor: pointer; }
.role-card .role-name { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
.role-card[aria-pressed="true"] { border-color: var(--accent); }
.role-card:focus-visible, .loc-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.time-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.time-field { display: grid; gap: 4px; font-weight: 600; font-size: .9rem; flex: 1 1 7rem; }
.time-field .text { font-family: var(--mono); }
.hours-out { font-family: var(--mono); font-weight: 700; color: var(--accent); padding-bottom: 10px; }
.mode-seg { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--field); }
.rec-list { display: grid; gap: 12px; }
.rec-row { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.rec-top { display: grid; grid-template-columns: minmax(0, 1fr) 9rem; gap: 8px; }
.rec-opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg-small button { padding: 6px 10px; font-size: .88rem; }
.icon-btn.small-x { width: 36px; height: 36px; margin-left: auto; }
.warn-t { color: var(--warn); }
.good-t { color: var(--good); }
.cw-row .phone { width: 9.5rem; flex: 0 1 auto; padding: 8px 10px; font-size: 15px; }
details.role-group summary { list-style: none; }
details.role-group summary::-webkit-details-marker { display: none; }
details.role-group summary::before { content: "▸ "; }
details.role-group[open] summary::before { content: "▾ "; }
a.btn { text-decoration: none; color: inherit; }
</style>

</head>

  var BY_ID = {};

  // =====================================================================
  // Basics
  // =====================================================================
  var KEY = 'tipout-web-v1';
  var ROSTER_VERSION = 2;            // bump when staff lists change
  var USER_ROLES = ['Server', 'Bartender', 'Barback', 'Host', 'Support'];
  var STAFF_ROLES = ['Server', 'Bar', 'Barback', 'Host', 'Support'];

  var BASE_TEXT = { sales: 'of sales', alcohol: 'of alcohol sales', food: 'of food sales', tips: 'of tips' };
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var ORDER = { Lunch: 0, Brunch: 0, Dinner: 1 };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function r2(x) { var s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; }
  function fmt(x) { x = r2(x || 0); return (x < 0 ? '-$' : '$') + Math.abs(x).toFixed(2); }
  function pctf(x) { return x.toFixed(1) + '%'; }
  function pctTxt(x) { return (Math.round(x * 100) / 100) + '%'; }
  function parse(s) {
    if (s == null) return null;
    var c = String(s).replace(/[$,\s]/g, '');
    if (c === '') return null;
    var n = Number(c);
    return isFinite(n) ? n : null;
  }
  function amtText(x) { return x ? r2(x).toFixed(2) : ''; }
  function sumBy(list, f) { return r2(list.reduce(function (a, x) { return a + (f(x) || 0); }, 0)); }

  // ----- Dates (work days stored as YYYY-MM-DD) -----
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function toDate(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function workDay() { return ymd(new Date(Date.now() - 28000 * 1000)); } // shifts past midnight count for the day they started
  function addDays(s, n) { var d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); }
  function suffix(n) { if (n >= 11 && n <= 13) return 'th'; return { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'; }
  function longDate(s) { var d = toDate(s); return DAYS[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate() + suffix(d.getDate()); }
  function shortDate(s) { var d = toDate(s); return DAYS[d.getDay()].slice(0, 3) + ' ' + MON[d.getMonth()] + ' ' + d.getDate(); }
  function sheetDate(s) { var d = toDate(s); return DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); }
  function weekStartOf(s) { var d = toDate(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
  function inWeek(ws, s) { return s >= ws && s <= addDays(ws, 6); }
  function weekTitle(ws) {
    var a = toDate(ws), b = toDate(addDays(ws, 6));
    return a.getMonth() === b.getMonth()
      ? MONTHS[a.getMonth()] + ' ' + a.getDate() + '–' + b.getDate()
      : MONTHS[a.getMonth()] + ' ' + a.getDate() + ' – ' + MONTHS[b.getMonth()] + ' ' + b.getDate();
  }
  function stamp(ms) {
    var d = new Date(ms), h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
    return shortDate(ymd(d)) + ', ' + d.getFullYear() + ' ' + ((h % 12) || 12) + ':' + m + (h < 12 ? ' AM' : ' PM');
  }
  function time12(t) { if (!t) return ''; var p = t.split(':').map(Number); return ((p[0] % 12) || 12) + ':' + String(p[1]).padStart(2, '0') + (p[0] < 12 ? ' AM' : ' PM'); }
  // Hours between two "HH:MM" times; an end before the start means it ran past midnight
  function hoursBetween(a, b) {
    if (!a || !b) return 0;
    var x = a.split(':').map(Number), y = b.split(':').map(Number);
    var mins = (y[0] * 60 + y[1]) - (x[0] * 60 + x[1]);
    if (mins <= 0) mins += 24 * 60;
    return Math.round(mins / 60 * 100) / 100;
  }
  function hoursTxt(h) { return (Math.round(h * 100) / 100) + ' h'; }

  // =====================================================================
  // Storage (this phone only)
  // =====================================================================
  var storageOK = true;
  function blankData() {
    return { v: 2, serverName: '', location: '', role: '', pctOverrides: {}, defaultCounts: {}, trackHours: false,
      coworkers: [], shifts: [], debts: [], log: [], seeded: {}, tourDone: {}, imported: [] };
  }
  function load() {
    try {
      localStorage.setItem(KEY + '-test', '1');
      localStorage.removeItem(KEY + '-test');
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : blankData();
    } catch (e) { storageOK = false; return blankData(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); storageOK = true; }
    catch (e) { storageOK = false; }
  }
  function log(text) {
    data.log.unshift({ id: uid(), at: Date.now(), text: text });
    if (data.log.length > 1500) data.log.length = 1500;
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // Brings older saves up to date without losing anything
  function migrate(d) {
    var out = Object.assign(blankData(), d);
    out.v = 2;
    out.seeded = out.seeded || {};
    if (out.rosterSeeded) { out.seeded.aurora = out.seeded.aurora || 1; delete out.rosterSeeded; }
    Object.keys(out.seeded).forEach(function (k) { if (out.seeded[k] === true) out.seeded[k] = 1; });
    // Old single set of percentages -> overrides for the current restaurant, only where they differ
    if (out.pct) {
      var key = out.location || 'aurora', R = BY_ID[key];
      if (R) {
        R.tipouts.forEach(function (t) {
          if (out.pct[t.id] != null && Math.abs(out.pct[t.id] - t.pct) > 1e-9) {
            out.pctOverrides[key] = out.pctOverrides[key] || {};
            out.pctOverrides[key][t.id] = out.pct[t.id];
          }
        });
      }
      delete out.pct;
    }
    if (out.defaultSupport) { out.defaultCounts.support = out.defaultSupport; delete out.defaultSupport; }
    if (out.tutorialDone) { out.tourDone.Server = true; delete out.tutorialDone; }
    // Before roles existed, everyone using the app was a server
    if (!out.role && out.serverName && out.shifts.length) out.role = 'Server';
    var auroraNames = (BY_ID.aurora.staff.Host || []).concat(BY_ID.aurora.staff.Support, BY_ID.aurora.staff.Bar).map(function (n) { return n.toLowerCase(); });
    out.coworkers.forEach(function (c) {
      if (!c.loc && out.seeded.aurora && auroraNames.indexOf(c.name.toLowerCase()) >= 0) c.loc = 'aurora';
    });
    out.shifts.forEach(function (s) {
      if (!s.location) s.location = 'aurora';
      if (!s.kind) s.kind = 'server';
      if (s.kind === 'server') {
        s.toggles = s.toggles || { barback: s.barback !== false, hostSplit: !!s.hostSplit };
        s.counts = s.counts || { support: s.supportCount || (s.twoSupport ? 2 : 1) };
      }
    });
    out.debts = out.debts || [];
    out.imported = out.imported || [];
    return out;
  }

  // Adds a restaurant's staff list (fills roles for names already there)
  function seedRoster(d, key) {
    var R = BY_ID[key];
    if (!R || !R.staff || (d.seeded[key] || 0) >= ROSTER_VERSION) return;
    Object.keys(R.staff).forEach(function (role) {
      R.staff[role].forEach(function (n) {
        var found = d.coworkers.find(function (c) { return c.loc === key && c.name.toLowerCase() === n.toLowerCase(); });
        if (found) { if (!found.role) found.role = role; }
        else d.coworkers.push({ id: uid(), name: n, role: role, loc: key });
      });
    });
    d.coworkers.sort(function (a, b) { return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; });
    d.seeded[key] = ROSTER_VERSION;
  }

  var data = migrate(load());
  if (data.location) seedRoster(data, data.location);
  save();

  // =====================================================================
  // Current restaurant + role helpers
  // =====================================================================
  function rest() { return BY_ID[data.location] || BY_ID.aurora; }
  // Jobs that use the tipout calculator: servers, plus any job the restaurant lists in roleTipouts
  function isServer() { var r = data.role || 'Server'; return r === 'Server' || !!(rest().roleTipouts && rest().roleTipouts[r]); }
  // Everyone except servers can log tips they receive (bartenders get both screens)
  function canReceive() { return (data.role || 'Server') !== 'Server'; }
  function hasBoth() { return isServer() && canReceive(); }
  // Which Shift screen is showing: the tipout calculator or tips received
  function calcMode() { return isServer() && !(hasBoth() && ui.mode === 'received'); }
  function tipouts() {
    var R = rest(), only = R.roleTipouts && R.roleTipouts[data.role];
    return only ? R.tipouts.filter(function (t) { return only.indexOf(t.id) >= 0; })
      : R.tipouts.filter(function (t) { return !t.onlyFor || t.onlyFor.indexOf(data.role) >= 0; });
  }
  function name() { return data.serverName || 'Your name'; }
  function shiftsFor(s) { return rest().days[toDate(s).getDay()].slice(); }
  function defaultShift(s) { var o = shiftsFor(s), h = new Date().getHours(); return (h >= 6 && h < 16 && o.length > 1) ? o[0] : o[o.length - 1]; }
  function pctFor(t) { var o = data.pctOverrides[data.location]; return o && o[t.id] != null ? o[t.id] : t.pct; }
  function usesBase(b) { return tipouts().some(function (t) { return t.base === b || (b === 'alcohol' && t.base === 'food'); }); }
  function team() { return data.coworkers.filter(function (c) { return !c.loc || c.loc === data.location; }); }
  function atLoc(sh) { return (sh.location || 'aurora') === (data.location || 'aurora'); }
  function isEnv(l) { return l.envelope || l.role === 'km'; }
  function isHouse(l) { return l.house || l.role === 'km'; }
  function roleKey(l) { return String(l.role || '').toLowerCase(); }

  // =====================================================================
  // Server calculations
  // =====================================================================
  function makeLines(f) {
    var TP = tipouts();
    var amounts = { sales: r2(parse(f.revenue) || 0), alcohol: r2(parse(f.alcohol) || 0), tips: r2(parse(f.tips) || 0) };
    amounts.food = r2(Math.max(0, amounts.sales - amounts.alcohol));
    var pct = {};
    TP.forEach(function (t) { pct[t.id] = pctFor(t); });
    TP.forEach(function (t) {
      if (t.toggle && !f.toggles[t.toggle.key]) {
        if (t.toggle.offInto && pct[t.toggle.offInto] != null) pct[t.toggle.offInto] += pct[t.id];
        pct[t.id] = null;
      }
    });
    var lines = [];
    TP.forEach(function (t) {
      if (pct[t.id] == null) return;
      var base = amounts[t.base || 'sales'], p = pct[t.id];
      var below = t.minSales && amounts.sales < t.minSales;
      function push(label, share) {
        lines.push({
          id: uid(), key: t.id, role: t.role || '', label: label,
          amount: below ? 0 : r2(base * share / 100),
          rule: pctTxt(share) + ' ' + BASE_TEXT[t.base || 'sales'] + (t.minSales ? ', if sales are at least ' + fmt(t.minSales) : ''),
          note: below ? 'Not owed: sales under ' + fmt(t.minSales) : '',
          house: !!t.house, envelope: !!t.envelope, person: '', paid: true
        });
      }
      if (t.split && f.toggles[t.split.key]) {
        for (var i = 1; i <= t.split.ways; i++) push(t.label + ' ' + i, p / t.split.ways);
      } else if (t.count) {
        var n = Math.max(1, Math.min(t.count.max, f.counts[t.id] || 1));
        if (n === 1) push(t.label, p);
        else for (var j = 1; j <= n; j++) push(t.label + ' ' + j, p);
      } else push(t.label, p);
    });
    return lines;
  }
  function serverCalc(e) {
    var total = sumBy(e.lines, function (l) { return l.amount; });
    var env = sumBy(e.lines.filter(isEnv), function (l) { return l.amount; });
    var envelope = r2(env + Math.max(e.cashDue, 0));
    var gross = r2((e.cashCollected || 0) - e.cashDue);
    var made = r2(gross - total);
    var tip = e.revenue > 0 ? gross / e.revenue * 100 : 0;
    return { total: total, env: env, envelope: envelope, gross: gross, made: made, tip: tip };
  }
  function receivedCalc(e) {
    var total = sumBy(e.received, function (r) { return r.amount; });
    var owed = sumBy(e.received.filter(function (r) { return !r.paid; }), function (r) { return r.amount; });
    return { total: total, owed: owed, paid: r2(total - owed) };
  }
  function earned(e) { return e.kind === 'received' ? receivedCalc(e).total : serverCalc(e).made; }
  function hoursOf(e) { return hoursBetween(e.start, e.end); }
  function envLines(e) { return e.lines.filter(isEnv); }
  function envNames(e) { return envLines(e).map(function (l) { return l.label; }).join(' + '); }
  function envTitle(e) {
    var n = envNames(e);
    if (!n) return 'Cash to hand in';
    return e.cashDue < 0 ? 'Envelope (' + n + ' only)' : 'Envelope (cash due + ' + n + ')';
  }
  function envLabel(e) { return name() + ' ' + longDate(e.date) + ' ' + e.shift; }
  function dueText(e) { return e.cashDue < 0 ? 'due back ' + fmt(-e.cashDue) : 'cash due ' + fmt(e.cashDue); }

  function summary(e) {
    if (e.kind === 'received') {
      var rc = receivedCalc(e);
      var out = [name() + ' – ' + longDate(e.date) + ' ' + e.shift, ''];
      e.received.forEach(function (r) { out.push((r.person || 'Someone') + ': ' + fmt(r.amount) + (r.paid ? '' : ' (not paid yet)') + (r.method ? ' · ' + r.method : '')); });
      out.push('', 'Total tips: ' + fmt(rc.total));
      if (rc.owed) out.push('Still owed: ' + fmt(rc.owed));
      if (hoursOf(e)) out.push('Hours: ' + hoursTxt(hoursOf(e)) + ' (' + fmt(rc.total / hoursOf(e)) + '/h)');
      return out.join('\n');
    }
    var c = serverCalc(e);
    var o = [envLabel(e), 'Revenue: ' + fmt(e.revenue)];
    envLines(e).forEach(function (l) { o.push(l.label + ': ' + fmt(l.amount)); });
    o.push('Cash due: ' + fmt(e.cashDue), envTitle(e) + ': ' + fmt(c.envelope), '');
    e.lines.forEach(function (l) {
      if (isEnv(l)) return;
      var row = l.label + ': ' + fmt(l.amount);
      if (l.person) row += ' (' + l.person + (l.paid ? '' : ', pay later') + ')';
      else if (!l.paid) row += ' (pay later)';
      o.push(row);
    });
    o.push('Total tipout: ' + fmt(c.total), '', 'Cash collected: ' + fmt(e.cashCollected || 0), 'Money made: ' + fmt(c.made), 'Tip %: ' + pctf(c.tip));
    if (hoursOf(e)) o.push('Hours: ' + hoursTxt(hoursOf(e)));
    return o.join('\n');
  }
  function weeklyReport(ws) {
    var dueBacks = data.shifts.filter(function (s) { return s.kind === 'server' && s.cashDue < 0 && inWeek(ws, s.date) && atLoc(s); });
    var lines = [(data.role === 'Bartender' ? 'Bartender: ' : 'Server: ') + name(), 'Week of ' + weekTitle(ws), ''];
    var days = {};
    dueBacks.forEach(function (s) { (days[s.date] = days[s.date] || []).push(s); });
    Object.keys(days).sort().forEach(function (d) {
      var parts = days[d].sort(function (a, b) { return ORDER[a.shift] - ORDER[b.shift]; })
        .map(function (s) { return s.shift.toLowerCase() + ': ' + fmt(-s.cashDue); });
      lines.push(sheetDate(d) + ' ' + parts.join(', '));
    });
    if (!dueBacks.length) lines.push('No due backs this week');
    lines.push('', 'Total: ' + fmt(sumBy(dueBacks, function (s) { return -s.cashDue; })));
    return lines.join('\n');
  }
  function avgTip(list) {
    var sv = list.filter(function (e) { return e.kind === 'server'; });
    var rev = sumBy(sv, function (e) { return e.revenue; });
    if (rev <= 0) return null;
    return sumBy(sv, function (e) { return serverCalc(e).gross; }) / rev * 100;
  }
  function sortShifts(list, desc) {
    return list.slice().sort(function (a, b) {
      var x = a.date === b.date ? ORDER[a.shift] - ORDER[b.shift] : (a.date < b.date ? -1 : 1);
      return desc ? -x : x;
    });
  }

  // ----- Owed -----
  function owedItems(theyOweMe) {
    var items = [];
    data.shifts.forEach(function (s) {
      if (s.kind === 'server' && !theyOweMe) {
        s.lines.forEach(function (l) {
          if (!l.paid) items.push({ id: l.id, shiftId: s.id, person: l.person, amount: l.amount, date: s.date, shift: s.shift, what: l.label + ' tipout', title: shortDate(s.date) + ' · ' + s.shift, detail: l.label + ' tipout' });
        });
      }
      if (s.kind === 'received' && theyOweMe) {
        s.received.forEach(function (r) {
          if (!r.paid) items.push({ id: r.id, shiftId: s.id, person: r.person, amount: r.amount, date: s.date, shift: s.shift, what: 'tipout', title: shortDate(s.date) + ' · ' + s.shift, detail: 'Tipout not paid yet' });
        });
      }
    });
    data.debts.forEach(function (d) {
      if (!d.settled && !!d.theyOweMe === theyOweMe) items.push({ id: d.id, debtId: d.id, person: d.person, amount: d.amount, date: d.date, shift: d.shift || '', what: d.note || '', title: shortDate(d.date), detail: d.note || 'Added by hand' });
    });
    return items;
  }
  function groupByPerson(items) {
    var g = {};
    items.forEach(function (i) { (g[i.person] = g[i.person] || []).push(i); });
    return Object.keys(g).sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; })
      .map(function (n) { return { name: n, items: g[n].sort(function (a, b) { return a.date < b.date ? -1 : 1; }) }; });
  }
  function sumItems(items) { return sumBy(items, function (i) { return i.amount; }); }

  // ----- Text messages -----
  // The code at the end of an IOU text lets the other person add it to their own app (no server involved)
  function b64urlEncode(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64urlDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
  function iouCode(item) {
    return '#TIP-' + b64urlEncode(JSON.stringify({ v: 1, i: item.id, f: data.serverName, a: item.amount, d: item.date, s: item.shift, w: item.what, r: data.location }));
  }
  function readIou(text) {
    var m = String(text || '').match(/#TIP-([A-Za-z0-9_-]+)/);
    if (!m) return null;
    try { var o = JSON.parse(b64urlDecode(m[1])); return (o && o.a > 0 && o.f) ? o : null; } catch (e) { return null; }
  }
  function phoneOf(person) {
    var c = team().find(function (x) { return x.name === person; }) || data.coworkers.find(function (x) { return x.name === person; });
    return c && c.phone ? c.phone.replace(/[^\d+]/g, '') : '';
  }
  function smsHref(person, body) { return 'sms:' + phoneOf(person) + '?&body=' + encodeURIComponent(body); }
  function iouText(item) {
    var when = shortDate(item.date) + (item.shift ? ' ' + item.shift.toLowerCase() : '');
    return 'Hey ' + item.person + ', I owe you ' + fmt(item.amount) + (item.what ? ' (' + item.what + ')' : '') + ' from ' + when + '. I\'ll pay you next time we work together. – ' + name() +
      '\n\nUsing the Tipout app? Copy this message and tap Owed → Add from a text. ' + iouCode(item);
  }
  function reminderText(item) {
    var when = shortDate(item.date) + (item.shift ? ' ' + item.shift.toLowerCase() : '');
    return 'Hey ' + item.person + ', friendly reminder: you owe me ' + fmt(item.amount) + ' from ' + when + '. Thanks! – ' + name();
  }

  // =====================================================================
  // UI state
  // =====================================================================
  function blankForm(date) {
    var d = date || workDay(), f = { date: d, shift: defaultShift(d), revenue: '', alcohol: '', tips: '', cashDue: '', dueBack: false, collected: '', start: '', end: '', toggles: {}, counts: {}, people: {}, later: {} };
    tipouts().forEach(function (t) {
      if (t.toggle) f.toggles[t.toggle.key] = t.toggle.on;
      if (t.split) f.toggles[t.split.key] = false;
      if (t.count) f.counts[t.id] = data.defaultCounts[t.id] || 1;
    });
    return f;
  }
  function formFrom(e) {
    var f = blankForm(e.date);
    f.shift = e.shift; f.revenue = amtText(e.revenue); f.alcohol = amtText(e.alcohol); f.tips = amtText(e.tips);
    f.cashDue = amtText(Math.abs(e.cashDue)); f.dueBack = e.cashDue < 0; f.collected = amtText(e.cashCollected || 0);
    f.start = e.start || ''; f.end = e.end || '';
    Object.assign(f.toggles, e.toggles || {}); Object.assign(f.counts, e.counts || {});
    e.lines.forEach(function (l) { if (!isHouse(l)) { f.people[l.label] = l.person; f.later[l.label] = !l.paid; } });
    return f;
  }
  function blankRForm(date) {

      rows: e.received.map(function (r) { return { id: r.id, person: r.person, amount: amtText(r.amount), method: r.method || '', notPaid: !r.paid, paidAt: r.paidAt }; }) };

  var ui = { tab: 'shift', weekStart: weekStartOf(workDay()), editingId: null, lastSaved: null, expanded: null, addDebt: null, debtForm: null,
    modal: null, nameDraft: data.serverName || '', newCoworker: '', newRole: 'Support', restore: '', search: '', showExamples: false,

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast((label || 'Text') + ' copied'); }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function attemptSave() {
    if (parse(form.revenue) == null) { toast('Enter revenue first'); return; }
    var d = serverDraft();
    if (d.lines.some(function (l) { return !l.paid && !l.person; })) {
      openModal({ title: 'Who do you owe?', message: 'Type a name for each tipout marked Pay later.', actions: [{ label: 'OK', primary: true }] });
      return;
    }
    confirmDuplicateThen(d);
  }
  function attemptSaveReceived() {
    var d = receivedDraft();
    if (!d.received.length) { toast('Add at least one amount'); return; }
    if (d.received.some(function (r) { return !r.paid && !r.person; })) {
      openModal({ title: 'Who owes you?', message: 'Type a name for each tipout marked Not paid yet.', actions: [{ label: 'OK', primary: true }] });
      return;
    }
    confirmDuplicateThen(d);
  }
  function confirmDuplicateThen(d) {
    var dup = data.shifts.find(function (s) { return s.id !== ui.editingId && s.kind === d.kind && s.date === d.date && s.shift === d.shift && atLoc(s); });
    if (dup) {
      openModal({ title: 'Shift already saved', message: 'You already saved ' + shortDate(d.date) + ' ' + d.shift.toLowerCase() + '. Replace it with this one?',
        actions: [{ label: 'Cancel' }, { label: 'Replace it', danger: true, fn: function () { commit(d, dup.id); } }] });
      return;

    commit(d, null);
  }
  function describe(e) {
    if (e.kind === 'received') { var rc = receivedCalc(e); return 'tips ' + fmt(rc.total) + (rc.owed ? ' (' + fmt(rc.owed) + ' not paid yet)' : ''); }
    return 'revenue ' + fmt(e.revenue) + ', ' + dueText(e) + ', tipout ' + fmt(serverCalc(e).total);
  }
  function commit(d, replaceId) {
    var old = ui.editingId ? findShift(ui.editingId) : null;
    if (d.kind === 'server') {
      d.lines.forEach(function (l) {
        if (!l.paid) return;
        var prev = old && old.lines && old.lines.find(function (o) { return o.label === l.label && o.person === l.person && o.paid; });
        l.paidAt = (prev && prev.paidAt) || Date.now();

    }
    if (old) { d.createdAt = old.createdAt; d.location = old.location || d.location; }
    if (replaceId) data.shifts = data.shifts.filter(function (s) { return s.id !== replaceId; });
    var label = name() + ' ' + longDate(d.date) + ' ' + d.shift, text;
    if (old) {
      data.shifts = data.shifts.map(function (s) { return s.id === old.id ? d : s; });
      text = 'Edited ' + label + ': ' + describe(d) + ' (was ' + shortDate(old.date) + ' ' + old.shift + ': ' + describe(old) + ')';
    } else {
      data.shifts.push(d);
      text = (replaceId ? 'Replaced ' : 'Saved ') + label + ': ' + describe(d);

    if (d.kind === 'server') {
      var owed = d.lines.filter(function (l) { return !l.paid; }).map(function (l) { return l.person + ' ' + fmt(l.amount); });

      if (e.kind === 'received' ? !canReceive() : !isServer()) { toast('Switch your job in Settings to edit this shift'); return; }
      ui.editingId = e.id; if (e.kind === 'received') { rform = rformFrom(e); ui.mode = 'received'; } else { form = formFrom(e); ui.mode = 'calc'; }
      ui.lastSaved = null; ui.tab = 'shift'; render(); window.scrollTo(0, 0);
    },
    copyShift: function (ds) { var e = findShift(ds.id); if (e) copyText(summary(e), 'Summary'); },
    settle: function (ds) { settleItem(ds.shift, ds.id); },
    week: function (ds) { ui.weekStart = addDays(ui.weekStart, 7 * Number(ds.v)); ui.expanded = null; render(); },
    copyReport: function () { copyText(weeklyReport(ui.weekStart), 'Due back sheet'); },
    shareReport: function () { shareText(weeklyReport(ui.weekStart), 'Due back sheet'); },
    copyWeekTips: function () { copyText(weekTipsText(ui.weekStart), 'Week summary'); },
    // owed
    addDebt: function (ds) { ui.addDebt = ds.v; ui.debtForm = { person: '', amount: '', note: '', date: workDay() }; render(); var p = document.getElementById('debt-person'); if (p) p.focus(); },
    cancelDebt: function () { ui.addDebt = null; render(); },
    saveDebt: function (ds) {
      var f = ui.debtForm, amount = parse(f.amount), person = f.person.trim();
      if (!person) { toast('Type a name'); return; }
      if (!amount || amount <= 0) { toast('Enter an amount'); return; }
      var theyOweMe = ds.v === '1';
      var debt = { id: uid(), date: f.date || workDay(), person: person, amount: r2(amount), note: f.note.trim(), theyOweMe: theyOweMe, settled: false, createdAt: Date.now() };
      data.debts.push(debt);
      log((theyOweMe ? 'Added: ' + person + ' owes you ' : 'Added: you owe ' + person + ' ') + fmt(debt.amount) + (debt.note ? ' – ' + debt.note : ''));
      save(); ui.addDebt = null; render(); toast('Added');
    },
    settleAll: function (ds) {
      var theyOweMe = ds.v === '1', person = ds.name, total = 0;
      data.shifts.forEach(function (s) {
        var list = s.kind === 'received' ? (theyOweMe ? s.received : []) : (theyOweMe ? [] : s.lines);
        list.forEach(function (x) { if (!x.paid && x.person === person) { x.paid = true; x.paidAt = Date.now(); total += x.amount; } });
      });
      data.debts.forEach(function (d) { if (!d.settled && d.person === person && !!d.theyOweMe === theyOweMe) { d.settled = true; d.settledAt = Date.now(); total += d.amount; } });
      log(theyOweMe ? person + ' paid you ' + fmt(total) + ' (everything they owed)' : 'Paid ' + person + ' ' + fmt(total) + ' (everything owed)');
      save(); render();
    },
    startImport: function () { ui.importing = true; ui.importText = ''; render(); var t = document.getElementById('import-text'); if (t) t.focus(); },
    cancelImport: function () { ui.importing = false; render(); },
    doImport: function () {
      var o = readIou(ui.importText);
      if (!o) { openModal({ title: 'No IOU found', message: 'Paste the whole message, including the code that starts with #TIP-.', actions: [{ label: 'OK', primary: true }] }); return; }
      if (data.imported.indexOf(o.i) >= 0) { toast('Already added'); ui.importing = false; render(); return; }
      var when = (o.d ? shortDate(o.d) : '') + (o.s ? ' ' + o.s : '');
      data.debts.push({ id: uid(), date: o.d || workDay(), shift: o.s || '', person: o.f, amount: r2(o.a), note: (o.w ? o.w + ' · ' : '') + when + ' (from a text)', theyOweMe: true, settled: false, createdAt: Date.now() });
      data.imported.push(o.i);
      log('Added from a text: ' + o.f + ' owes you ' + fmt(o.a) + ' (' + when + ')');
      save(); ui.importing = false; ui.importText = ''; render(); toast(o.f + ' owes you ' + fmt(o.a));
    },
    // settings
    lockPct: function () { ui.pctUnlocked = false; render(); },
    defCount: function (ds) {
      var t = tipouts().find(function (x) { return x.id === ds.k; }); if (!t) return;
      data.defaultCounts[ds.k] = Math.max(1, Math.min(t.count.max, (data.defaultCounts[ds.k] || 1) + Number(ds.v)));
      log('Set ' + t.count.label.toLowerCase() + ' per shift to ' + data.defaultCounts[ds.k]); save();
      if (!ui.editingId && parse(form.revenue) == null) form.counts[ds.k] = data.defaultCounts[ds.k];
      render();
    },
    addCoworker: function () {
      var n = ui.newCoworker.trim(); if (!n) return;
      if (!team().some(function (c) { return c.name.toLowerCase() === n.toLowerCase(); })) {
        data.coworkers.push({ id: uid(), name: n, role: ui.newRole || '', loc: data.location });
        data.coworkers.sort(function (a, b) { return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; });
        log('Added coworker ' + n + (ui.newRole ? ' (' + ui.newRole + ')' : '')); save();
      } else toast(n + ' is already on the list');
      ui.newCoworker = ''; render();
      var i = document.getElementById('new-coworker'); if (i) i.focus();
    },
    copyBackup: function () { copyText(JSON.stringify(data), 'Backup'); },
    downloadBackup: function () {
      try {
        var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tipout-backup-' + workDay() + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      } catch (e) { copyText(JSON.stringify(data), 'Backup'); }
    },
    modal: function (ds) { var m = ui.modal, a = m && m.actions[Number(ds.i)]; closeModal(); if (a && a.fn) { a.fn(); render(); } },
    modalBack: function (ds, el, ev) { if (ev.target === el) closeModal(); }
  };

  // Actions that need a press-and-hold
  var holdActions = {
    deleteShift: function (ds) { deleteShift(ds.id); ui.expanded = null; render(); toast('Shift deleted'); },
    deleteDebt: function (ds) {
      var d = data.debts.find(function (x) { return x.id === ds.id; }); if (!d) return;
      data.debts = data.debts.filter(function (x) { return x.id !== d.id; });
      log('Deleted entry: ' + (d.theyOweMe ? d.person + ' owes you ' : 'you owe ' + d.person + ' ') + fmt(d.amount));
      save(); render(); toast('Entry deleted');
    },
    removeCoworker: function (ds) {
      var c = data.coworkers.find(function (x) { return x.id === ds.id; }); if (!c) return;
      data.coworkers = data.coworkers.filter(function (x) { return x.id !== ds.id; });
      log('Removed coworker ' + c.name); save(); render(); toast(c.name + ' removed');
    },
    unlockPct: function () { ui.pctUnlocked = true; render(); },
    resetPct: function () { delete data.pctOverrides[data.location]; log('Reset percentages to ' + rest().name + ' defaults'); save(); render(); toast('Percentages reset'); },
    restore: function () {
      var parsed; try { parsed = JSON.parse(ui.restore); } catch (e) { parsed = null; }
      if (!parsed || !Array.isArray(parsed.shifts)) { openModal({ title: 'That backup did not work', message: 'Paste the whole backup text, starting with { and ending with }.', actions: [{ label: 'OK', primary: true }] }); return; }
      data = migrate(parsed); if (data.location) seedRoster(data, data.location);
      log('Restored from backup (' + data.shifts.length + ' shifts)'); save(); ui.restore = ''; resetForms(); render(); toast('Backup restored');
    }
  };

  // ----- Events -----
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var fn = actions[el.dataset.act];
    if (fn) fn(el.dataset, el, ev);
  });

  // Press and hold (~1s) for risky actions; releasing early cancels
  var HOLD_MS = 900, holding = null, lastHoldDone = 0;
  function startHold(el) {
    cancelHold();
    el.classList.add('holding');
    holding = { el: el, timer: setTimeout(function () {
      var ds = Object.assign({}, el.dataset), fn = holdActions[ds.hold];
      cancelHold();
      lastHoldDone = Date.now();
      if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
      if (fn) fn(ds);
    }, HOLD_MS) };
  }
  function cancelHold() { if (holding) { clearTimeout(holding.timer); holding.el.classList.remove('holding'); holding = null; } }
  document.addEventListener('pointerdown', function (ev) { var el = ev.target.closest('[data-hold]'); if (el) { ev.preventDefault(); startHold(el); } });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { document.addEventListener(t, function (ev) { if (holding && (t !== 'pointerleave' || ev.target === holding.el)) cancelHold(); }, true); });
  document.addEventListener('contextmenu', function (ev) { if (ev.target.closest('[data-hold]')) ev.preventDefault(); });
  document.addEventListener('click', function (ev) { var el = ev.target.closest('[data-hold]'); if (el && !holding && Date.now() - lastHoldDone > 600) toast('Press and hold to confirm'); });
  document.addEventListener('keydown', function (ev) {
    var el = ev.target.closest && ev.target.closest('[data-hold]');
    if (el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); if (!ev.repeat && !holding) startHold(el); return; }
    if (ev.key === 'Escape' && ui.modal) closeModal();
    if (ev.key === 'Enter' && ev.target.id === 'new-coworker') actions.addCoworker();
    if (ev.key === 'Enter' && ev.target.id === 'first-name') actions.saveFirstName();
  });
  document.addEventListener('keyup', function (ev) { if (holding && (ev.key === 'Enter' || ev.key === ' ')) cancelHold(); });

  // Typing: update state without rebuilding the field you're typing in
  document.addEventListener('input', function (ev) {
    var t = ev.target, f = t.dataset.f;
    if (!f) return;
    if (f === 'revenue' || f === 'cashDue' || f === 'collected' || f === 'alcohol' || f === 'tips') { form[f] = t.value; renderOutputs(); }
    else if (f === 'person') form.people[t.dataset.label] = t.value;
    else if (f === 'rPerson') rform.rows[Number(t.dataset.i)].person = t.value;
    else if (f === 'rAmount') { rform.rows[Number(t.dataset.i)].amount = t.value; renderReceivedTotals(); }
    else if (f === 'start' || f === 'end') { state()[f] = t.value; if (calcMode()) renderOutputs(); else renderReceivedTotals(); }
    else if (f === 'search') { ui.search = t.value; var l = document.getElementById('rest-list'); if (l) l.innerHTML = restaurantRows(); }
    else if (f === 'nameDraft') ui.nameDraft = t.value;
    else if (f === 'newCoworker') ui.newCoworker = t.value;
    else if (f === 'restore') ui.restore = t.value;
    else if (f === 'importText') ui.importText = t.value;
    else if (f === 'debtPerson') ui.debtForm.person = t.value;
    else if (f === 'debtAmount') ui.debtForm.amount = t.value;
    else if (f === 'debtNote') ui.debtForm.note = t.value;
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target, f = t.dataset.f;
    if (t.id === 'restore-file' && t.files && t.files[0]) {
      var reader = new FileReader();
      reader.onload = function () { ui.restore = String(reader.result || ''); render(); toast('Backup loaded. Press and hold to replace your data.'); };
      reader.readAsText(t.files[0]);
      return;
    }
    if (!f) return;
    if (f === 'date') { if (t.value) setDate(t.value); }
    else if (f === 'debtDate') ui.debtForm.date = t.value;
    else if (f === 'toggle') { form.toggles[t.dataset.k] = t.checked; renderOutputs(); }
    else if (f === 'later') { form.later[t.dataset.label] = t.checked; renderOutputs(); }
    else if (f === 'rNotPaid') { rform.rows[Number(t.dataset.i)].notPaid = t.checked; renderReceivedTotals(); }
    else if (f === 'showExamples') { ui.showExamples = t.checked; render(); }
    else if (f === 'trackHours') { data.trackHours = t.checked; log(t.checked ? 'Turned on hours' : 'Turned off hours'); save(); toast(t.checked ? 'Hours turned on' : 'Hours turned off'); }
    else if (f === 'newRole') ui.newRole = t.value;
    else if (f === 'coworkerRole') {
      var cw = data.coworkers.find(function (c) { return c.id === t.dataset.id; });
      if (cw && t.value) { cw.role = t.value; log('Set ' + cw.name + ' to ' + t.value); save(); render(); }
    }
    else if (f === 'cwPhone') {
      var c2 = data.coworkers.find(function (c) { return c.id === t.dataset.id; });
      if (c2) { c2.phone = t.value.trim(); save(); toast('Saved'); }
    }
    else if (f === 'serverName') {
      var n = t.value.trim();
      if (n && n !== data.serverName) { data.serverName = n; ui.nameDraft = n; log('Changed name to ' + n); save(); toast('Name saved'); }
    }
    else if (f === 'pct') {
      var v = parse(t.value), k = t.dataset.k;
      var tdef = rest().tipouts.find(function (x) { return x.id === k; });
      if (v == null || v < 0 || v > 50) { t.value = pctFor(tdef); toast('Enter a percent between 0 and 50'); return; }
      data.pctOverrides[data.location] = data.pctOverrides[data.location] || {};
      data.pctOverrides[data.location][k] = Math.round(v * 100) / 100;
      log('Changed ' + tdef.label + ' to ' + data.pctOverrides[data.location][k] + '% at ' + rest().name);
      save(); toast('Saved');
    }
  });

  render();
})();

</script>

</body>
</html>
